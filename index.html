<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Land Contribution</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0f0f10;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  p{color:#bbb;font-family:system-ui,sans-serif;padding:24px}
</style>
</head>
<body>
<script>
(function () {
  var EXEC = 'https://script.google.com/macros/s/AKfycbzxiD-FTls3ltR3tZHbCRLt4d_vWWtLmPN_fYeJNusqiU3jn-QXMZtJBKervDcysnp0/exec';
  var tg = window.Telegram && window.Telegram.WebApp;
  var init = '';
  var scheme = 'dark';
  if (tg) {
    try { tg.ready(); } catch (e) {}
    try { tg.expand(); } catch (e) {}
    try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
    try { tg.setHeaderColor && tg.setHeaderColor(tg.colorScheme === 'light' ? '#f4f5f3' : '#0f0f10'); } catch (e) {}
    try { tg.setBackgroundColor && tg.setBackgroundColor(tg.colorScheme === 'light' ? '#f4f5f3' : '#0f0f10'); } catch (e) {}
    init = tg.initData || '';
    scheme = tg.colorScheme || 'dark';
  }
  if (scheme === 'light') document.body.style.background = '#f4f5f3';
  var f = document.createElement('iframe');
  f.src = EXEC + '#tgWebAppData=' + encodeURIComponent(init) + '&tgWebAppColorScheme=' + encodeURIComponent(scheme);
  f.setAttribute('allow', 'clipboard-write');
  document.body.appendChild(f);
})();
</script>
</body>
</html>
