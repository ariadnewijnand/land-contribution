<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Land Contribution</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0f0f10;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  p{color:#bbb;font-family:system-ui,sans-serif;padding:24px}
  #a2hs{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(72px + env(safe-area-inset-bottom, 0px));
    z-index:20;display:flex;align-items:center;gap:2px;
    max-width:calc(100% - 24px);
    background:#1c1c1e;color:#f2f2f3;
    border:1px solid rgba(255,255,255,.08);border-radius:99px;
    padding:4px 4px 4px 14px;
    font:500 12px/1.3 system-ui,-apple-system,sans-serif;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  #a2hs[hidden]{display:none !important}
  #a2hs .add{appearance:none;background:transparent;border:0;color:inherit;font:inherit;padding:8px 6px;min-height:36px}
  #a2hs .dismiss{appearance:none;background:transparent;border:0;color:#a1a1a7;width:36px;min-height:36px;border-radius:99px;font:500 18px/1 system-ui;padding:0}
  body.light #a2hs{background:#fff;color:#242825;border-color:rgba(30,48,37,.10);box-shadow:0 8px 24px rgba(30,48,37,.10)}
  body.light #a2hs .dismiss{color:#6c736e}
</style>
</head>
<body>
<div id="a2hs" hidden>
  <button type="button" class="add">Add to Home Screen</button>
  <button type="button" class="dismiss" aria-label="Dismiss">×</button>
</div>
<script>
(function () {
  var EXEC = 'https://script.google.com/macros/s/AKfycbzxiD-FTls3ltR3tZHbCRLt4d_vWWtLmPN_fYeJNusqiU3jn-QXMZtJBKervDcysnp0/exec';
  var DISMISS_KEY = 'lc-a2hs-dismissed';
  var tg = window.Telegram && window.Telegram.WebApp;
  var init = '';
  var scheme = 'dark';
  if (tg) {
    try { tg.ready(); } catch (e) {}
    try { tg.expand(); } catch (e) {}
    try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
    try { tg.setHeaderColor && tg.setHeaderColor(tg.colorScheme === 'light' ? '#f4f5f3' : '#0f0f10'); } catch (e) {}
    try { tg.setBackgroundColor && tg.setBackgroundColor(tg.colorScheme === 'light' ? '#f4f5f3' : '#0f0f10'); } catch (e) {}
    init = tg.initData || '';
    scheme = tg.colorScheme || 'dark';
  }
  if (scheme === 'light') {
    document.body.style.background = '#f4f5f3';
    document.body.classList.add('light');
  }
  var f = document.createElement('iframe');
  f.src = EXEC + '#tgWebAppData=' + encodeURIComponent(init) + '&tgWebAppColorScheme=' + encodeURIComponent(scheme);
  f.setAttribute('allow', 'clipboard-write');
  document.body.appendChild(f);

  var pill = document.getElementById('a2hs');
  function dismissed() {
    try { return window.localStorage.getItem(DISMISS_KEY) === '1'; } catch (e) { return false; }
  }
  function rememberDismiss() {
    try { window.localStorage.setItem(DISMISS_KEY, '1'); } catch (e) {}
  }
  function hidePill() {
    if (pill) pill.hidden = true;
  }
  function showPill() {
    if (pill && !dismissed()) pill.hidden = false;
  }
  function statusOf(value) {
    if (!value) return '';
    return typeof value === 'string' ? value : String(value.status || '');
  }
  function applyStatus(value) {
    var status = statusOf(value);
    if (status === 'added' || status === 'unsupported') {
      hidePill();
      return;
    }
    if (status === 'missed' || status === 'missing' || status === 'unknown') showPill();
  }
  if (pill) {
    pill.querySelector('.add').addEventListener('click', function () {
      try { if (tg && tg.addToHomeScreen) tg.addToHomeScreen(); } catch (e) {}
    });
    pill.querySelector('.dismiss').addEventListener('click', function () {
      rememberDismiss();
      hidePill();
    });
  }
  if (tg && tg.isVersionAtLeast && tg.isVersionAtLeast('8.0') && tg.addToHomeScreen && tg.checkHomeScreenStatus) {
    try {
      if (tg.onEvent) {
        tg.onEvent('homeScreenAdded', function () { rememberDismiss(); hidePill(); });
        tg.onEvent('homeScreenChecked', applyStatus);
      }
      tg.checkHomeScreenStatus(applyStatus);
    } catch (e) {}
  }
})();
</script>
</body>
</html>
