<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Land Contribution</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  html,body{margin:0;padding:0;height:100%;background:#0f0f10;overflow:hidden}
  iframe{position:fixed;inset:0;width:100%;height:100%;border:0;display:block;background:#0f0f10;opacity:0;pointer-events:none}
  iframe.ready{opacity:1;pointer-events:auto}
  p{color:#bbb;font-family:system-ui,sans-serif;padding:24px}
  :root{--bg:#0f0f10;--text:#f2f2f3;--hint:#a1a1a7;--card:#1c1c1e;--secondary:#27272b;--line:rgba(255,255,255,.08);--ok:#80cba3;--track:#303034;--pill:#2b2b30;--green-tint:rgba(63,158,110,.15)}
  body.light{--bg:#f4f5f3;--text:#242825;--hint:#6c736e;--card:#fff;--secondary:#f0f2ee;--line:rgba(30,48,37,.10);--ok:#32744f;--track:#e5e9e3;--pill:#ecefea;--green-tint:#e5f1e8}
  #skeleton,#snapshot{position:fixed;inset:0;z-index:5;padding:24px 16px calc(102px + env(safe-area-inset-bottom, 0px));color:var(--text);font:400 14px/1.5 system-ui,-apple-system,sans-serif;max-width:640px;margin:auto;box-sizing:border-box;overflow:auto;pointer-events:none;background:var(--bg)}
  #skeleton h1,#snapshot h1{font-size:28px;letter-spacing:-.8px;font-weight:650;margin:0}
  #skeleton .lede,#snapshot .lede{color:var(--hint);font-size:13px;margin:8px 0 0}
  #skeleton .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}
  #skeleton .tile,#skeleton .bar,#skeleton .row,#skeleton .navsk{background:var(--card);border:1px solid var(--line);border-radius:16px}
  #skeleton .tile{height:88px}
  #skeleton .bar{height:10px;border-radius:99px;margin:14px 0 22px}
  #skeleton .row{height:54px;border-radius:12px;margin-top:8px}
  #skeleton .navsk,#snapshot .navsk{position:fixed;left:0;right:0;bottom:0;height:calc(65px + env(safe-area-inset-bottom, 0px));border-radius:0;border-left:0;border-right:0;border-bottom:0;z-index:6;background:var(--card);border-top:1px solid var(--line)}
  #skeleton[hidden],#snapshot[hidden]{display:none !important}
  body.light{background:#f4f5f3}
  body.light iframe{background:#f4f5f3}
  #snapshot .viewer-line{margin-top:12px;font-size:12px;color:var(--hint)}
  #snapshot .kicker{font-size:10px;color:var(--hint);letter-spacing:.13em;font-weight:600;text-transform:uppercase;margin:16px 0 10px}
  #snapshot .months{display:flex;gap:6px;overflow:hidden;margin:16px 0 14px}
  #snapshot .chip{border:1px solid var(--line);border-radius:10px;min-height:38px;padding:7px 12px;color:var(--hint);white-space:nowrap;font-size:12px}
  #snapshot .chip.on{color:var(--text);background:var(--secondary);border-color:transparent;font-weight:600}
  #snapshot .number-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  #snapshot .number-tile{min-width:0;border:1px solid var(--line);background:var(--card);border-radius:16px;padding:16px 14px}
  #snapshot .number-label{color:var(--hint);font-size:12px;display:block;margin-bottom:7px}
  #snapshot .big-number{font-size:clamp(23px,6.5vw,32px);font-weight:600;letter-spacing:-.8px;line-height:1.25;font-variant-numeric:tabular-nums;margin:0}
  #snapshot .received-tile .big-number{color:var(--ok)}
  #snapshot .bar{background:var(--track);height:7px;border-radius:99px;overflow:hidden;margin:16px 0 9px}
  #snapshot .bar > span{display:block;height:100%;background:#3f9e6e;border-radius:inherit}
  #snapshot .progress-caption{display:flex;justify-content:space-between;gap:10px;color:var(--hint);font-size:11px}
  #snapshot .progress-caption b{color:var(--text);font-weight:600}
  #snapshot .secondary-stats{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-top:14px;padding:12px 14px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
  #snapshot .stat b{display:block;font-size:15px;font-weight:600;font-variant-numeric:tabular-nums}
  #snapshot .stat span{display:block;margin-top:2px;font-size:10px;color:var(--hint)}
  #snapshot .card{margin-top:16px;padding:18px 16px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
  #snapshot .section-heading{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:0}
  #snapshot h2{font-size:18px;line-height:1.35;font-weight:600;letter-spacing:-.35px;margin:0}
  #snapshot .tag{display:inline-flex;align-items:center;font-size:11px;line-height:1.5;padding:4px 9px;font-weight:500;border-radius:99px;color:var(--hint);background:var(--pill)}
  #snapshot .tag.ok{color:var(--ok);background:var(--green-tint)}
  #snapshot .my-amounts{display:flex;justify-content:space-between;gap:12px;margin:12px 0 10px}
  #snapshot .my-amounts span{display:block;color:var(--hint);font-size:11px;margin-bottom:4px}
  #snapshot .my-amounts b{font-size:21px;font-weight:600;letter-spacing:-.4px}
  #snapshot .my-amounts div:last-child b{color:var(--ok)}
  #snapshot .instalments{border-top:1px solid var(--line);padding-top:12px;margin-top:14px}
  #snapshot .instalments h3{font-size:13px;margin:0 0 4px;font-weight:600}
  #snapshot .instalment-list{list-style:none;padding:0;margin:0}
  #snapshot .instalment-row{display:flex;justify-content:space-between;gap:8px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
  #snapshot .instalment-row:last-child{border-bottom:0}
  #snapshot .people-sheet{padding:18px 12px 2px;margin-top:16px;border:1px solid var(--line);border-radius:16px;background:var(--card)}
  #snapshot .people-sheet .section-heading{padding:0 4px;margin-bottom:6px}
  #snapshot .tiny{color:var(--hint);font-size:11px}
  #snapshot .person-row{min-height:65px;display:grid;grid-template-columns:minmax(58px,1fr) 28px auto auto;gap:7px;align-items:center;border-top:1px solid var(--line);padding:10px 3px}
  #snapshot .person-name{font-weight:500;font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  #snapshot .mini-bar{height:4px;background:var(--track);border-radius:99px;overflow:hidden}
  #snapshot .mini-bar span{display:block;height:100%;background:#3f9e6e}
  #snapshot .person-amount{font-size:11px;white-space:nowrap;font-variant-numeric:tabular-nums}
  #snapshot .person-amount .due{color:var(--hint)}
  #snapshot .running-total{font-size:11px;color:var(--hint);margin:10px 2px 0}
  #snapshot .running-total b{font-weight:500;color:var(--text)}
  #a2hs{
    position:fixed;left:50%;transform:translateX(-50%);
    bottom:calc(72px + env(safe-area-inset-bottom, 0px));
    z-index:20;display:flex;align-items:center;gap:2px;
    max-width:calc(100% - 24px);
    background:#1c1c1e;color:#f2f2f3;
    border:1px solid rgba(255,255,255,.08);border-radius:99px;
    padding:4px 4px 4px 14px;
    font:500 12px/1.3 system-ui,-apple-system,sans-serif;
    box-shadow:0 8px 24px rgba(0,0,0,.35);
  }
  #a2hs[hidden]{display:none !important}
  #a2hs .add{appearance:none;background:transparent;border:0;color:inherit;font:inherit;padding:8px 6px;min-height:36px}
  #a2hs .dismiss{appearance:none;background:transparent;border:0;color:#a1a1a7;width:36px;min-height:36px;border-radius:99px;font:500 18px/1 system-ui;padding:0}
  body.light #a2hs{background:#fff;color:#242825;border-color:rgba(30,48,37,.10);box-shadow:0 8px 24px rgba(30,48,37,.10)}
  body.light #a2hs .dismiss{color:#6c736e}
</style>
</head>
<body>
<div id="skeleton" aria-hidden="true">
  <h1>Land Contribution</h1>
  <p class="lede">Everyone's land contributions, in one place.</p>
  <div class="tiles"><div class="tile"></div><div class="tile"></div></div>
  <div class="bar"></div>
  <div class="row"></div>
  <div class="row"></div>
  <div class="row"></div>
  <div class="navsk"></div>
</div>
<div id="snapshot" hidden aria-hidden="true"></div>
<div id="a2hs" hidden>
  <button type="button" class="add">Add to Home Screen</button>
  <button type="button" class="dismiss" aria-label="Dismiss">×</button>
</div>
<script>
(function () {
  var EXEC = 'https://script.google.com/macros/s/AKfycbzxiD-FTls3ltR3tZHbCRLt4d_vWWtLmPN_fYeJNusqiU3jn-QXMZtJBKervDcysnp0/exec';
  var DISMISS_KEY = 'lc-a2hs-dismissed';
  var FRAME_ORIGINS = /^https:\/\/([a-z0-9-]+\.)*(script\.googleusercontent\.com|script\.google\.com)$/i;
  var tg = window.Telegram && window.Telegram.WebApp;
  var init = '';
  var scheme = 'dark';
  if (tg) {
    try { tg.ready(); } catch (e) {}
    try { tg.expand(); } catch (e) {}
    try { if (tg.disableVerticalSwipes) tg.disableVerticalSwipes(); } catch (e) {}
    try { tg.setHeaderColor && tg.setHeaderColor(tg.colorScheme === 'light' ? '#f4f5f3' : '#0f0f10'); } catch (e) {}
    try { tg.setBackgroundColor && tg.setBackgroundColor(tg.colorScheme === 'light' ? '#f4f5f3' : '#0f0f10'); } catch (e) {}
    init = tg.initData || '';
    scheme = tg.colorScheme || 'dark';
  }
  if (scheme === 'light') {
    document.body.style.background = '#f4f5f3';
    document.body.classList.add('light');
  }

  function esc(value) {
    return String(value == null ? '' : value)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
  function money(cents, symbol) {
    var neg = cents < 0;
    var abs = Math.abs(Math.round(Number(cents) || 0));
    var frac = String(abs % 100);
    if (frac.length < 2) frac = '0' + frac;
    var grouped = String(Math.floor(abs / 100)).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
    return (neg ? '-' : '') + symbol + grouped + '.' + frac;
  }
  function usd(cents) { return money(cents, '$'); }
  function compactUsd(cents) { return usd(cents).replace(/\.00$/, ''); }
  function todaySast() {
    var parts = new Intl.DateTimeFormat('en-US', {
      timeZone: 'Africa/Johannesburg', year: 'numeric', month: '2-digit', day: '2-digit'
    }).formatToParts(new Date());
    var bag = {};
    for (var i = 0; i < parts.length; i++) bag[parts[i].type] = parts[i].value;
    return bag.year + '-' + bag.month + '-' + bag.day;
  }
  function prettyDate(iso) {
    if (!iso) return '';
    var names = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    return Number(iso.slice(8, 10)) + ' ' + names[Number(iso.slice(5, 7)) - 1] + ' ' + iso.slice(0, 4);
  }
  function userIdFromInit(initData) {
    try {
      var m = /(?:^|&)user=([^&]*)/.exec(initData || '');
      if (!m) return '';
      var u = JSON.parse(decodeURIComponent(m[1]));
      return u && u.id ? String(u.id) : '';
    } catch (e) { return ''; }
  }
  function cacheKey(id) { return id ? 'lc-boot-v1-' + id : ''; }
  function readBoot(id) {
    try {
      var k = cacheKey(id);
      if (!k) return null;
      var v = window.localStorage.getItem(k);
      return v ? JSON.parse(v) : null;
    } catch (e) { return null; }
  }
  function writeBoot(id, payload) {
    try {
      var k = cacheKey(id);
      if (k && payload && payload.state === 'ready' && payload.month && payload.month.monthKey === todaySast().slice(0, 7)) {
        window.localStorage.setItem(k, JSON.stringify(payload));
      }
    } catch (e) {}
  }
  function personStatus(person) {
    if (person.paidInFull) return '<span class="tag ok">Paid in full</span>';
    if (person.lateFlag && person.lateFlag.expectedDate) return '<span class="tag">Late, expected ' + esc(prettyDate(person.lateFlag.expectedDate).replace(/ \d{4}$/, '')) + '</span>';
    if (!person.obligationUsdCents && !person.outstandingUsdCents) return '<span class="tag">No amount due</span>';
    return '<span class="tag">In progress</span>';
  }
  function canPaint(payload, userId) {
    if (!userId || !payload || payload.state !== 'ready' || !payload.month) return false;
    if (payload.month.monthKey !== todaySast().slice(0, 7)) return false;
    var viewer = payload.viewer || {};
    if (viewer.telegramUserId && String(viewer.telegramUserId) !== String(userId)) return false;
    return true;
  }
  function paintSnapshot(payload, userId) {
    if (!canPaint(payload, userId)) return false;
    var month = payload.month;
    var viewer = payload.viewer || {};
    var width = Math.max(0, Math.min(100, month.progressPercent || 0));
    var chips = '';
    var months = payload.months || [];
    for (var i = 0; i < months.length; i++) {
      var label = months[i].label || '';
      var shortLabel = /^(January|February|March|April|May|June|July|August|September|October|November|December) \d{4}$/.test(label) ? label.slice(0, 3) : label;
      chips += '<span class="chip' + (months[i].monthKey === month.monthKey ? ' on' : '') + '">' + esc(shortLabel) + '</span>';
    }
    var person = null;
    var people = (month.people || []).slice().sort(function (a, b) {
      return String(a.name || '').localeCompare(String(b.name || ''), undefined, { sensitivity: 'base' });
    });
    for (var p = 0; p < people.length; p++) {
      if (viewer.personId && people[p].personId === viewer.personId) person = people[p];
    }
    var mine = '<section class="card"><h2>My contribution</h2>';
    if (!viewer.personId) {
      mine += '<p class="tiny">Once your name is linked, your monthly contribution will appear here.</p></section>';
    } else if (!person) {
      mine += '<p class="tiny">There is no contribution listed for you this month.</p></section>';
    } else {
      mine = '<section class="card"><div class="section-heading"><h2>My contribution</h2>' + personStatus(person) + '</div>' +
        '<div class="my-amounts"><div><span>Due this month</span><b>' + esc(usd(person.obligationUsdCents)) + '</b></div><div><span>Confirmed</span><b>' + esc(usd(person.confirmedUsdCents)) + '</b></div></div>';
      var instalments = month.instalments || [];
      if (instalments.length) {
        mine += '<div class="instalments"><h3>Payment dates · ' + esc(month.label) + '</h3><ul class="instalment-list">';
        for (var n = 0; n < instalments.length; n++) {
          mine += '<li class="instalment-row"><span><b>' + esc(compactUsd(instalments[n].amountUsdCents)) + '</b> · by ' + esc(prettyDate(instalments[n].due)) + '</span></li>';
        }
        mine += '</ul></div>';
      }
      mine += '</section>';
    }
    var list = '';
    for (var r = 0; r < people.length; r++) {
      var row = people[r];
      var bar = row.obligationUsdCents > 0 ? Math.max(0, Math.min(100, row.confirmedUsdCents / row.obligationUsdCents * 100)) : (row.paidInFull ? 100 : 0);
      list += '<div class="person-row"><span class="person-name">' + esc(row.name) + '</span><span class="mini-bar"><span style="width:' + bar + '%"></span></span><span class="person-amount">' + esc(compactUsd(row.confirmedUsdCents)) + '<span class="due"> / ' + esc(compactUsd(row.obligationUsdCents)) + '</span></span>' + personStatus(row) + '</div>';
    }
    var box = document.getElementById('snapshot');
    box.innerHTML = '<header><h1>Land Contribution</h1><p class="lede">Everyone\'s land contributions, in one place.</p>' +
      (viewer.personName ? '<p class="viewer-line">' + esc(viewer.personName) + (viewer.isAdmin ? ' · Admin' : '') + '</p>' : '') + '</header>' +
      (chips ? '<div class="months">' + chips + '</div>' : '') +
      '<section><p class="kicker">' + esc(month.label) + '</p><div class="number-tiles">' +
      '<div class="number-tile"><span class="number-label">Monthly target</span><p class="big-number">' + esc(compactUsd(month.targetUsdCents)) + '</p></div>' +
      '<div class="number-tile received-tile"><span class="number-label">Received</span><p class="big-number">' + esc(compactUsd(month.receivedUsdCents)) + '</p></div></div>' +
      '<div class="bar"><span style="width:' + width + '%"></span></div>' +
      '<div class="progress-caption"><b>' + esc(String(month.progressPercent)) + '% funded</b><span>Confirmed payments only</span></div>' +
      '<div class="secondary-stats"><div class="stat"><b>' + esc(compactUsd(month.outstandingUsdCents)) + '</b><span>Still to collect</span></div><div class="stat"><b>' + esc(month.paidInFull) + ' of ' + esc(month.peopleCount) + '</b><span>Paid in full</span></div></div></section>' +
      mine +
      '<section class="people-sheet"><div class="section-heading"><h2>Everyone</h2><span class="tiny">Confirmed / due</span></div>' + (list || '<p class="tiny">Nobody is on this month yet.</p>') + '</section>' +
      '<p class="running-total">Received since Aug 2026: <b>' + esc(usd(payload.runningReceivedUsdCents || 0)) + '</b></p><div class="navsk"></div>';
    box.hidden = false;
    var sk = document.getElementById('skeleton');
    if (sk) sk.hidden = true;
    return true;
  }
  var currentUser = userIdFromInit(init);
  var frameReady = false;
  var iframeSource = null;
  function showApp() {
    if (frameReady) return;
    frameReady = true;
    f.className = 'ready';
    var sk = document.getElementById('skeleton');
    if (sk) sk.hidden = true;
    var snap = document.getElementById('snapshot');
    if (snap) snap.hidden = true;
  }

  if (currentUser) paintSnapshot(readBoot(currentUser), currentUser);

  window.addEventListener('message', function (event) {
    if (!FRAME_ORIGINS.test(event.origin)) return;
    var data = event.data || {};
    if (data.type === 'lc-ready') {
      iframeSource = event.source;
      showApp();
      return;
    }
    if (data.type === 'lc-cache-get') {
      iframeSource = event.source;
      var id = String(data.userId || '');
      if (!id || (currentUser && id !== currentUser)) return;
      var payload = readBoot(id);
      try { event.source.postMessage({ type: 'lc-cache-data', userId: id, payload: payload }, event.origin); } catch (e) {}
      return;
    }
    if (data.type === 'lc-cache-set') {
      var setId = String(data.userId || '');
      if (!setId || (currentUser && setId !== currentUser)) return;
      writeBoot(setId, data.payload);
    }
  });

  var f = document.createElement('iframe');
  f.src = EXEC + '#tgWebAppData=' + encodeURIComponent(init) + '&tgWebAppColorScheme=' + encodeURIComponent(scheme);
  f.setAttribute('allow', 'clipboard-write');
  f.setAttribute('title', 'Land Contribution');
  document.body.appendChild(f);
  setTimeout(showApp, 8000);

  var pill = document.getElementById('a2hs');
  function dismissed() {
    try { return window.localStorage.getItem(DISMISS_KEY) === '1'; } catch (e) { return false; }
  }
  function rememberDismiss() {
    try { window.localStorage.setItem(DISMISS_KEY, '1'); } catch (e) {}
  }
  function hidePill() {
    if (pill) pill.hidden = true;
  }
  function showPill() {
    if (pill && !dismissed()) pill.hidden = false;
  }
  function statusOf(value) {
    if (!value) return '';
    return typeof value === 'string' ? value : String(value.status || '');
  }
  function applyStatus(value) {
    var status = statusOf(value);
    if (status === 'added' || status === 'unsupported') {
      hidePill();
      return;
    }
    if (status === 'missed' || status === 'missing' || status === 'unknown') showPill();
  }
  if (pill) {
    pill.querySelector('.add').addEventListener('click', function () {
      try { if (tg && tg.addToHomeScreen) tg.addToHomeScreen(); } catch (e) {}
    });
    pill.querySelector('.dismiss').addEventListener('click', function () {
      rememberDismiss();
      hidePill();
    });
  }
  if (tg && tg.isVersionAtLeast && tg.isVersionAtLeast('8.0') && tg.addToHomeScreen && tg.checkHomeScreenStatus) {
    try {
      if (tg.onEvent) {
        tg.onEvent('homeScreenAdded', function () { rememberDismiss(); hidePill(); });
        tg.onEvent('homeScreenChecked', applyStatus);
      }
      tg.checkHomeScreenStatus(applyStatus);
    } catch (e) {}
  }
  window.__lcWrapper = { canPaint: canPaint, paintSnapshot: paintSnapshot, readBoot: readBoot, writeBoot: writeBoot, todaySast: todaySast, userIdFromInit: userIdFromInit, esc: esc, compactUsd: compactUsd };
})();
</script>
</body>
</html>
